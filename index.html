<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSnap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css" />
</head>

<body>
    <main
        class="min-h-screen bg-gradient-to-br from-[#8EBCF7] via-[#7FB2F5] to-[#70A8F4] p-4 flex items-center justify-center"
        id="main">

        <div class="w-full max-w-lg flex flex-col items-center text-center text-white">

            <header class="w-full mb-6">
                <h1 class="mb-6 text-4xl md:text-5xl font-medium drop-shadow-md" id="titulo">
                    WeatherSnap☀️
                </h1>

                <nav class="flex items-center justify-between w-full px-2">
                    <div
                        class="flex items-center gap-2 bg-white/30 backdrop-blur-md px-4 py-2 rounded-xl border border-white/20 shadow-sm cursor-pointer hover:bg-white/40 transition">
                        <i class="fa-solid fa-house"></i>
                        <span class="font-medium">Início</span>
                    </div>
                    <div class="flex items-center gap-3 hover:text-white/80 transition">
                        <i class="fa-solid fa-chart-simple"></i>
                        <a href="#" class="font-medium">Comparar</a>
                    </div>
                </nav>
            </header>

            <div
                class="w-full mb-5 bg-white/20 backdrop-blur-md rounded-xl border border-white/20 overflow-hidden shadow-lg">
                <form id="clima-form" class="flex">
                    <input type="text" id="input-form" placeholder="Ex: Schroeder, SC"
                        class="flex-1 bg-transparent p-4 placeholder-white/70 outline-none text-white">
                    <button type="submit"
                        class="bg-white/20 px-6 py-4 font-bold hover:bg-white/30 transition-colors border-l border-white/10">
                        <i class="fa-solid fa-magnifying-glass md:hidden"></i>
                        <span class="hidden md:inline">Buscar</span>
                    </button>
                </form>
            </div>

            <div class="w-full bg-white/30 backdrop-blur-md rounded-[2rem] p-6 shadow-2xl border border-white/20">

                <div class="flex justify-between items-start mb-2">
                    <div class="text-left">
                        <h3 id="nome-cidade" class="text-2xl md:text-3xl font-bold leading-tight">
                            Schroeder, SC
                        </h3>
                        <p id="dia-cidade" class="text-sm opacity-90">
                            Qui, 30/04/2026
                        </p>
                    </div>
                    <div class="flex gap-4 text-xl opacity-80">
                        <i class="fa-solid fa-chart-simple hover:scale-110 transition cursor-pointer"></i>
                        <i class="fa-solid fa-share-nodes hover:scale-110 transition cursor-pointer"></i>
                    </div>
                </div>

                <div class="py-8">
                    <i class="wi wi-day-sunny text-7xl" id="simbolo-principal"></i>
                    <h2 id="temperatura-cidade" class="text-7xl font-bold tracking-tighter mb-2 mt-3">
                        26°C
                    </h2>
                    <p id="clima-cidade" class="text-xl font-medium capitalize mb-4">
                        Nublado
                    </p>

                    <div class="flex justify-center gap-8 text-sm bg-white/10 py-3 rounded-2xl">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-wind opacity-70"></i>
                            <span id="vento-cidade">1.01 km/h</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-droplet opacity-70"></i>
                            <span id="humidade-cidade">63%</span>
                        </div>
                    </div>
                </div>

                <div id="frase-cidade" class="bg-white/20 p-4 rounded-2xl mb-6">
                    <p class="font-medium italic">"Clima perfeito para uma caminhada"</p>
                </div>
                <div class="flex gap-5">
                    <div
                        class="w-full max-w-[180px] mx-auto bg-white/20 p-4 rounded-2xl border border-white/10 shadow-inner">
                        <p id="proximo-dia-cidade" class="text-lg font-bold">Qui.</p>
                        <i id="segundo-simbolo"></i>
                        <p id="proximo-temperatura-cidade" class="text-2xl font-black">33°C</p>
                    </div>
                    <div
                        class="w-full max-w-[180px] mx-auto bg-white/20 p-4 rounded-2xl border border-white/10 shadow-inner">
                        <p id="dois-dias-cidade" class="text-lg font-bold">Qui.</p>
                        <i id="terceiro-simbolo"></i>
                        <p id="dois-temp-cidade" class="text-2xl font-black">33°C</p>
                    </div>
                    <div
                        class="w-full max-w-[180px] mx-auto bg-white/20 p-4 rounded-2xl border border-white/10 shadow-inner">
                        <p id="tres-dias-cidade" class="text-lg font-bold">Qui.</p>
                        <i id="quarto-simbolo"></i>
                        <p id="tres-temp-cidade" class="text-2xl font-black">33°C</p>
                    </div>
                </div>
            </div>


        </div>

        <script src="script.js"></script>
    </main>
</body>

</html>
